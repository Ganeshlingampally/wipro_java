<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Website Feedback Survey</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    form {
      background: white;
      padding: 20px;
      border-radius: 5px;
      max-width: 500px;
      margin: auto;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    input, select, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 3px;
    }
    input[type="radio"], input[type="checkbox"] {
      width: auto;
    }
    button {
      margin-top: 15px;
      padding: 10px 15px;
      background: #1abc9c;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 3px;
    }
    button:hover {
      background: #16a085;
    }
  </style>
</head>
<body>

<h1>Website Feedback Survey</h1>

<form>
  <label>Full Name:</label>
  <input type="text" name="fullname" required>

  <label>Email Address:</label>
  <input type="email" name="email" required>

  <label>Age:</label>
  <input type="number" name="age" min="10" max="100">

  <label>Rate website design (1–10):</label>
  <input type="range" name="designRating" min="1" max="10">

  <label>Rate content quality:</label>
  <input type="radio" name="contentQuality" value="Excellent"> Excellent
  <input type="radio" name="contentQuality" value="Good"> Good
  <input type="radio" name="contentQuality" value="Average"> Average
  <input type="radio" name="contentQuality" value="Poor"> Poor

  <label>Most visited page:</label>
  <select name="mostVisited">
    <option>Home</option>
    <option>Blog</option>
    <option>Products</option>
    <option>Contact</option>
  </select>

  <label>Your comments:</label>
  <textarea name="comments" rows="4"></textarea>

  <input type="checkbox" name="contactConsent"> I agree to be contacted

  <button type="submit">Submit Feedback</button>
</form>

</body>
</html>
