spring.application.name=Springboot
# Server port
server.port=8080

# MySQL datasource configuration
spring.datasource.url=jdbc:mysql://localhost:3306/wipro_user
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate settings (optional if you use JdbcTemplate only)
spring.jpa.hibernate.ddl-auto=none 
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# This can be enabled to see the H2 console if you use H2 (not in your case)
# spring.h2.console.enabled=true

# Allow bean overriding (if needed)
spring.main.allow-bean-definition-overriding=true
